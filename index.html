  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }
</style>

    calendar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
    x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    chevronDown: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    infinity: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.26-8-12.356-8-5.095 0-5.095 8 0 8 5.096 0 7.26-8 12.356-8z"/></svg>',
    target: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
    grid: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  };

  var MONTH_NAMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  var state = {
    loading: true,
    saving: false,
    transactions: [],
    goals: [],
    settings: { currencySymbol: '$', title: 'Lista privada', darkMode: true, budgets: {} },
    activeView: 'resumen',
    periodType: 'month',
    selectedMonth: monthKey(new Date()),
    selectedYear: String(new Date().getFullYear()),
    showListMenu: false,
    showPeriodMenu: false,
    searchOpen: false,
    searchText: '',
    listening: false,
    speechSupported: false,
    voicePhase: null,
    voiceMultiResults: [],
    quickText: '',
    presetCategoryActive: false,
    txForm: { type: 'expense', amount: '', category: '', description: '', date: todayISO() },
    contributingGoalId: null,
    showQuickAdd: false,
    showManualEdit: false,
    showAddGoal: false,
    showSettings: false,
  };
  var recognition = null;
  var toastTimer = null;

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function formatMoney(amount, symbol) {
    var n = Number(amount) || 0;
    var formatted = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.abs(n));
    return formatted + (symbol == null ? '' : symbol);
  }
  function shortHash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
    return Math.abs(h).toString(36).slice(0, 5).toUpperCase();
  }

  function formatCompact(amount) {
    var n = Math.abs(Number(amount) || 0);
    if (n >= 1000000) { var m = n / 1000000; return (Number.isInteger(m) ? m : m.toFixed(1)) + 'M'; }
    if (n >= 1000) return Math.round(n / 1000) + 'k';
    return String(Math.round(n));
  }
  function categoryEmoji(name, type) {
    var list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i].emoji;
    return '✨';
  }
  function categoryColor(name) {
    var idx = EXPENSE_CATEGORIES.findIndex(function (c) { return c.name === name; });
    return CAT_COLORS[idx > -1 ? idx % CAT_COLORS.length : CAT_COLORS.length - 1];
  }

  function extractAmount(text) {
    var match = text.match(/\d[\d.,]*\d|\d/);
    if (!match) return { amount: null, rest: text.trim() };
    var raw = match[0];
    var idx = match.index;
    var rest = (text.slice(0, idx) + text.slice(idx + raw.length)).replace(/[$]/g, ' ').replace(/\s+/g, ' ').trim();
    var lastComma = raw.lastIndexOf(','), lastDot = raw.lastIndexOf('.');
    var decimalSep = null;
    if (lastComma > -1 && lastDot > -1) decimalSep = lastComma > lastDot ? ',' : '.';
    else if (lastComma > -1) decimalSep = (raw.length - lastComma - 1) === 2 ? ',' : null;
    else if (lastDot > -1) decimalSep = (raw.length - lastDot - 1) === 2 ? '.' : null;
    var normalized;
    if (decimalSep) {
      var other = decimalSep === ',' ? '.' : ',';
      normalized = raw.split(other).join('').replace(decimalSep, '.');
    } else {
      normalized = raw.replace(/[.,]/g, '');
    }
    var amount = parseFloat(normalized);
    return { amount: isNaN(amount) ? null : amount, rest: rest };
  }

  function parseQuickAdd(text) {
    var lower = text.toLowerCase();
    var extracted = extractAmount(text);
    var isIncome = INCOME_KEYWORDS.some(function (k) { return lower.indexOf(k) !== -1; });
    var type = isIncome ? 'income' : 'expense';
    var category = 'Otros';
    if (isIncome) {
      if (lower.indexOf('sueldo') !== -1 || lower.indexOf('salario') !== -1 || lower.indexOf('nomina') !== -1 || lower.indexOf('nómina') !== -1) category = 'Salario';
      else if (lower.indexOf('freelance') !== -1) category = 'Freelance';
      else if (lower.indexOf('invers') !== -1) category = 'Inversiones';
      else if (lower.indexOf('regalo') !== -1) category = 'Regalo';
    } else {
      outer:
      for (var cat in EXPENSE_KEYWORDS) {
        var kws = EXPENSE_KEYWORDS[cat];
        for (var i = 0; i < kws.length; i++) if (lower.indexOf(kws[i]) !== -1) { category = cat; break outer; }
      }
    }
    return { amount: extracted.amount, type: type, category: category, description: extracted.rest || '' };
  }

  function cleanSegmentText(s) {
    return s
      .replace(/^[\s,.;:]+/, '')
      .replace(/^(y|and|más|mas|también|además|ademas|con|de)\s+/i, '')
      .replace(/[\s,.;:]+$/, '')
      .trim();
  }

  function parseMultiple(text) {
    var re = /\d[\d.,]*\d|\d/g;
    var positions = [];
    var m;
    while ((m = re.exec(text)) !== null) positions.push({ raw: m[0], start: m.index, end: m.index + m[0].length });
    if (positions.length <= 1) {
      var single = parseQuickAdd(text);
      return single.amount != null ? [single] : [];
    }
    var results = [];
    var cursor = 0;
    for (var i = 0; i < positions.length; i++) {
      var chunk = text.slice(cursor, positions[i].end);
      var parsed = parseQuickAdd(chunk);
      parsed.description = cleanSegmentText(parsed.description || '');
      if (!parsed.description) parsed.description = parsed.category;
      if (parsed.amount != null) results.push(parsed);
      cursor = positions[i].end;
    }
    return results;
  }

  /* ---------- storage: localStorage cache + optional Firebase sync ---------- */
  function firebaseUrl() {
    var url = localStorage.getItem('firebase-db-url');
    return url ? url.replace(/\/$/, '') : null;
  }
  function applyData(data) {
    state.transactions = Array.isArray(data.transactions) ? data.transactions : [];
    state.goals = Array.isArray(data.goals) ? data.goals : [];
    state.settings = Object.assign({ currencySymbol: '$', title: 'Lista privada', darkMode: true, budgets: {} }, data.settings || {});
    if (!state.settings.budgets) state.settings.budgets = {};
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) applyData(JSON.parse(raw));
    } catch (e) {}
    state.loading = false;
  }
  function loadFromFirebase() {
    var url = firebaseUrl();
    if (!url) return Promise.resolve(undefined);
    return fetch(url + '/finance-data.json').then(function (res) { if (!res.ok) throw new Error('bad'); return res.json(); }).catch(function () { return undefined; });
  }
  function saveToFirebase(payload) {
    var url = firebaseUrl();
    if (!url) return Promise.resolve(true);
    return fetch(url + '/finance-data.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (res) { return res.ok; }).catch(function () { return false; });
  }
  function saveToFirebaseWithRetry(payload, attempt) {
    attempt = attempt || 0;
    return saveToFirebase(payload).then(function (ok) {
      if (ok || attempt >= 2) return ok;
      return new Promise(function (resolve) { setTimeout(function () { resolve(saveToFirebaseWithRetry(payload, attempt + 1)); }, 500 * (attempt + 1)); });
    });
  }
  function saveState() {
    state.saving = true;
    renderTopIcons();
    var payload = { transactions: state.transactions, goals: state.goals, settings: state.settings };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
    if (firebaseUrl()) {
      saveToFirebaseWithRetry(payload).then(function (ok) {
        state.saving = false; renderTopIcons();
        if (!ok) showToast('No se sincronizó. Se guardó en este teléfono.');
      });
    } else { state.saving = false; renderTopIcons(); }
  }
  function initialFirebaseSync() {
    if (!firebaseUrl()) return;
    loadFromFirebase().then(function (data) {
      if (data) { applyData(data); applyTheme(); render(); }
    });
  }
  function refreshFromStorage() {
    if (firebaseUrl()) {
      loadFromFirebase().then(function (data) {
        if (data) applyData(data);
        applyTheme();
        showToast(data ? 'Actualizado' : 'Sin conexión; se ve la copia local');
        render();
      });
    } else { loadState(); applyTheme(); showToast('Actualizado'); render(); }
  }
  function applyTheme() { document.body.className = state.settings.darkMode === false ? 'light' : 'dark'; }

  function showToast(msg) {
    var existing = document.getElementById('toastEl');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.id = 'toastEl'; el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { var e = document.getElementById('toastEl'); if (e) e.remove(); }, 2400);
  }

  /* ---------- period filtering ---------- */
  function txInPeriod(t) {
    if (!t.date) return false;
    if (state.periodType === 'all') return true;
    if (state.periodType === 'year') return t.date.slice(0, 4) === state.selectedYear;
    return t.date.slice(0, 7) === state.selectedMonth;
  }
  function periodTransactions() { return state.transactions.filter(txInPeriod); }

  function monthTotal(key) {
    var income = 0, expense = 0;
    state.transactions.forEach(function (t) {
      if ((t.date || '').slice(0, 7) === key) { if (t.type === 'income') income += t.amount; else expense += t.amount; }
    });
    return income - expense;
  }
  function monthList() {
    var base = state.selectedMonth ? new Date(state.selectedMonth + '-01T00:00:00') : new Date();
    var list = [];
    for (var i = -3; i <= 3; i++) {
      var d = new Date(base.getFullYear(), base.getMonth() + i, 1);
      list.push({ key: monthKey(d), name: MONTH_NAMES[d.getMonth()] });
    }
    return list;
  }

  function computeTotals(list) {
    var income = 0, expense = 0;
    list.forEach(function (t) { if (t.type === 'income') income += t.amount; else expense += t.amount; });
    return { income: income, expense: expense, balance: income - expense };
  }
  function computeCategoryBars(list) {
    var map = {};
    list.filter(function (t) { return t.type === 'expense'; }).forEach(function (t) { map[t.category] = (map[t.category] || 0) + t.amount; });
    var budgets = state.settings.budgets || {};
    return Object.keys(map).map(function (n) {
      var budget = Number(budgets[n]) || 0;
      return { name: n, value: map[n], budget: budget, pct: budget > 0 ? Math.round((map[n] / budget) * 100) : null };
    }).sort(function (a, b) { return b.value - a.value; }).slice(0, 5);
  }

  /* ---------- render ---------- */
  function render() {
    var app = document.getElementById('app');
    if (state.loading) {
      app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span style="color:var(--red)" class="spin">' + ICONS.settings + '</span></div>';
      return;
    }
    if (state.activeView === 'metas') {
      app.innerHTML = '<div class="wrap fade-in">' + renderMetasHeader() + renderMetas() + '</div>';
      return;
    }
    var list = periodTransactions();
    app.innerHTML = '<div class="wrap fade-in">' + renderHeader() + renderTotals(list) + renderBars(list) + renderSearchAndList(list) + '</div>' + renderBottomBar();
  }

  function renderTopIcons() {
    var el = document.getElementById('savingIndicator');
    if (el) el.style.display = state.saving ? 'inline-flex' : 'none';
  }

  function renderHeader() {
    var s = state.settings;
    var html = '<header class="hero"><div class="head-row">';
    html += '<button class="pill-btn" data-action="toggle-list-menu">' + escapeHtml(s.title || 'Lista privada') + ICONS.chevronDown + '</button>';
    html += '<div class="head-icons">';
    html += '<span id="savingIndicator" style="display:' + (state.saving ? 'inline-flex' : 'none') + ';color:var(--red);align-items:center;" class="spin">' + ICONS.settings + '</span>';
    html += '<button class="icon-btn" data-action="toggle-period-menu" aria-label="Periodo">' + ICONS.calendar + '</button>';
    html += '<button class="icon-btn" data-action="open-settings" aria-label="Ajustes">' + ICONS.settings + '</button>';
    html += '</div>';
    if (state.showListMenu) {
      html += '<div class="dropdown-menu">' +
        '<button data-action="close-menus-goto" data-goto="resumen" class="' + (state.activeView === 'resumen' ? 'sel' : '') + '">' + ICONS.grid + ' Resumen</button>' +
        '<button data-action="close-menus-goto" data-goto="metas">' + ICONS.target + ' Metas</button>' +
        '</div>';
    }
    if (state.showPeriodMenu) {
      html += '<div class="dropdown-menu period-menu">' +
        '<button data-action="set-period" data-period="month" class="' + (state.periodType === 'month' ? 'sel' : '') + '">' + (state.periodType === 'month' ? ICONS.check : ICONS.calendar) + ' Mes</button>' +
        '<button data-action="set-period" data-period="year" class="' + (state.periodType === 'year' ? 'sel' : '') + '">' + (state.periodType === 'year' ? ICONS.check : ICONS.calendar) + ' Año</button>' +
        '<button data-action="set-period" data-period="all" class="' + (state.periodType === 'all' ? 'sel' : '') + '">' + (state.periodType === 'all' ? ICONS.check : ICONS.infinity) + ' Todo el tiempo</button>' +
        '</div>';
    }
    html += '</div>';
    if (state.periodType === 'month') {
      html += '<div class="month-scroll" id="monthScroll">' + monthList().map(function (m) {
        var active = m.key === state.selectedMonth;
        return '<button class="month-item ' + (active ? 'active' : '') + '" data-action="select-month" data-month="' + m.key + '">' +
          '<span class="m-name disp">' + m.name + '</span>' +
          (active ? '' : '<span class="m-val">' + formatMoney(monthTotal(m.key), s.currencySymbol) + '</span>') +
          '</button>';
      }).join('') + '</div>';
    }
    html += '</header>';
    return html;
  }

  function renderTotals(list) {
    var totals = computeTotals(list);
    var s = state.settings;
    var positive = totals.balance >= 0;
    var html = '';
    if (state.periodType === 'month') {
      var budgets = s.budgets || {};
      var totalBudget = 0;
      Object.keys(budgets).forEach(function (k) { totalBudget += Number(budgets[k]) || 0; });
      if (totalBudget > 0 && totals.expense > totalBudget) {
        html += '<p class="over-budget-line">' + formatMoney(totals.expense - totalBudget, s.currencySymbol) + ' sobre presupuesto</p>';
      }
    }
    html += '<p class="total-label">Total</p>';
    html += '<div class="total-row">' +
      '<span class="sign-circle" style="background:' + (positive ? 'var(--green)' : 'var(--red)') + '">' + (positive ? ICONS.plus : ICONS.minus) + '</span>' +
      '<span class="total-num disp">' + formatMoney(totals.balance, '') + '</span>' +
      '<span class="total-sym disp">' + escapeHtml(s.currencySymbol) + '</span></div>';
    html += '<div class="stat-pill-combo">' +
      '<div class="stat-half"><span class="mini-circle" style="background:' + (positive ? 'var(--surface2)' : 'var(--red-tint-soft)') + ';color:var(--red)">' + ICONS.minus + '</span><span class="stat-half-num disp">' + formatMoney(totals.expense, '') + '</span></div>' +
      '<div class="stat-half ' + (positive ? 'active-side' : '') + '"><span class="mini-circle" style="background:' + (positive ? 'var(--green-tint)' : 'var(--surface2)') + ';color:var(--green)">' + ICONS.plus + '</span><span class="stat-half-num disp">' + formatMoney(totals.income, '') + '</span></div>' +
      '</div>';
    return html;
  }

  function renderBars(list) {
    var bars = computeCategoryBars(list);
    var html = '<div class="bars-section">';
    if (!bars.length) {
      var heights = [78, 55, 40, 22];
      html += '<div class="bars-row">' + heights.map(function (h) {
        return '<div class="bar-col"><div class="bar-rect skeleton" style="height:' + h + '%"></div></div>';
      }).join('') + '</div>';
      html += '<div class="bars-empty-overlay"><p class="disp">Tus transacciones se mostrarán aquí</p></div>';
    } else {
      var max = bars[0].value || 1;
      html += '<div class="bars-row">' + bars.map(function (b) {
        var over = b.pct != null && b.pct > 100;
        var h = b.pct != null ? Math.max(22, Math.min(100, b.pct)) : Math.max(22, Math.round((b.value / max) * 100));
        var barColor = over ? '#ff5233' : categoryColor(b.name);
        var badge = b.pct != null ? '<span class="bar-pct" style="color:' + (over ? '#ff5233' : 'var(--faint)') + '">' + b.pct + '%</span>' : '';
        return '<div class="bar-col">' + badge + '<div class="bar-rect" style="height:' + h + '%;background:' + barColor + '">' +
          '<span class="bar-emoji">' + categoryEmoji(b.name, 'expense') + '</span>' +
          '<span class="bar-amount">' + formatCompact(b.value) + '</span></div></div>';
      }).join('') + '</div>';
    }
    html += '</div>';
    return html;
  }

  function txItemHtml(t) {
    var color = t.type === 'income' ? 'var(--green)' : 'var(--red)';
    var bg = t.type === 'income' ? 'var(--green-tint)' : 'var(--red-tint-soft)';
    return '<li class="tx-item">' +
      '<div class="tx-left"><span class="tx-icon" style="background:' + bg + '">' + categoryEmoji(t.category, t.type) + '</span>' +
      '<div style="min-width:0"><p class="tx-desc">' + escapeHtml(t.description || t.category) + '</p>' +
      '<p class="tx-meta">' + escapeHtml(t.category) + ' · ' + escapeHtml(t.date) + '</p></div></div>' +
      '<div class="tx-right"><span class="tx-amount disp" style="color:' + color + '">' + (t.type === 'income' ? '+' : '\u2212') + formatMoney(t.amount, state.settings.currencySymbol) + '</span>' +
      '<button data-action="delete-tx" data-id="' + t.id + '" aria-label="Eliminar" style="color:var(--faint)">' + ICONS.trash + '</button></div></li>';
  }

  function renderSearchAndList(list) {
    var filtered = list;
    if (state.searchText.trim()) {
      var q = state.searchText.trim().toLowerCase();
      filtered = filtered.filter(function (t) { return (t.description || '').toLowerCase().indexOf(q) !== -1 || (t.category || '').toLowerCase().indexOf(q) !== -1; });
    }
    filtered = filtered.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || '') || (b.id || '').localeCompare(a.id || ''); });
    var inner = '';
    if (state.searchOpen) {
      inner += '<div class="search-row" style="margin:0 0 16px;">' + ICONS.search + '<input id="txSearchInput" placeholder="Buscar" value="' + escapeHtml(state.searchText) + '" autofocus></div>';
    }
    if (filtered.length) {
      inner += '<ul class="tx-list" id="txListContainer">' + filtered.map(txItemHtml).join('') + '</ul>';
    } else if (state.searchOpen) {
      inner += '<div class="empty" id="txListContainer"><p class="big disp">Sin resultados</p><p class="sub">Prueba otra búsqueda</p></div>';
    }
    if (!inner) return '';
    return '<div class="section">' + inner + '</div>';
  }

  function renderBottomBar() {
    return '<div class="bottom-bar">' +
      '<div class="bottom-left">' +
      '<button data-action="open-quick-add" aria-label="Agregar">' + ICONS.plus + '</button>' +

  function startAudioReactiveOrb() {
    var orb = document.getElementById('voiceOrb');
    if (orb) orb.classList.add('idle');
  }

  function stopAudioReactiveOrb() {
    var orb = document.getElementById('voiceOrb');
    if (orb) orb.classList.remove('idle');
  }

  function openQuickAdd() {
    state.quickText = '';
    state.showManualEdit = false;
    state.presetCategoryActive = false;
    state.txForm = { type: 'expense', amount: '', category: '', description: '', date: todayISO() };
    renderQuickAddModal();
  }

  function openMicEntry() {
    if (recognition) openVoiceCapture();
    else { openQuickAdd(); showToast('Dictado no disponible: escribe arriba.'); }
  }

  function openVoiceCapture() {
    state.quickText = '';
    state.presetCategoryActive = false;
    state.voiceMultiResults = [];
    state.txForm = { type: 'expense', amount: '', category: '', description: '', date: todayISO() };
    state.voicePhase = 'listening';
    renderVoiceOverlay();
    setTimeout(function () {
      try { recognition.start(); state.listening = true; renderVoiceOverlay(); startAudioReactiveOrb(); } catch (e) { state.listening = false; renderVoiceOverlay(); }
    }, 200);
  }

  function closeVoiceCapture() {
    if (recognition && state.listening) { try { recognition.stop(); } catch (e) {} }
    state.listening = false;
    state.voicePhase = null;
    stopAudioReactiveOrb();
    var root = document.getElementById('voiceRoot');
    if (root) root.remove();
  }

  function stopVoiceListening() {
    if (recognition && state.listening) {
      try {
        recognition.stop();
        setTimeout(function () { if (state.voicePhase === 'listening') showVoiceResult(); }, 700);
      } catch (e) { showVoiceResult(); }
    } else {
      showVoiceResult();
    }
  }

  function showVoiceResult() {
    state.listening = false;
    state.voicePhase = 'result';
    stopAudioReactiveOrb();
    renderVoiceOverlay();
  }

        '</div>';

  function categoryTint(name) {
    var idx = EXPENSE_CATEGORIES.findIndex(function (c) { return c.name === name; });
    var tints = ['#3a1710', '#3a241b', '#2a2a2a', '#5c2418', '#3a241b', '#2e2e2e', '#4a2818', '#1a1a1a'];
    return tints[idx > -1 ? idx % tints.length : tints.length - 1];
  }

  function removeMultiCandidate(idx) {
    state.voiceMultiResults.splice(idx, 1);
    if (!state.voiceMultiResults.length) { closeVoiceCapture(); return; }
    renderVoiceOverlay();
  }

  function saveAllVoiceTransactions() {
    var items = state.voiceMultiResults;
    if (!items.length) return;
    var now = Date.now();
    items.forEach(function (it, i) {
      state.transactions.unshift({
        id: 'tx_' + (now + i),
        type: it.type,
        amount: it.amount,
        category: it.category,
        description: (it.description || '').trim(),
        date: todayISO(),
      });

    showToast('¡' + count + ' movimientos guardados!');

    var tx = { id: 'tx_' + Date.now(), type: state.txForm.type, amount: amt, category: state.txForm.category, description: (state.txForm.description || '').trim(), date: state.txForm.date || todayISO() };

  function renderQuickAddModal() {
    var body = '<div class="qa-top"><button class="qa-close" data-action="close-modal" aria-label="Cerrar">' + ICONS.x + '</button></div>' +
      '<div class="qa-pills"><span class="qa-pill">' + ICONS.calendar + ' hoy</span><span class="qa-pill">' + ICONS.chevronDown + ' Una vez</span></div>' +
      '<input id="qaDescription" class="qa-field" placeholder="Descripción" value="' + escapeHtml(state.txForm.description) + '">' +
      '<input id="qaAmount" class="qa-field" placeholder="Monto" inputmode="decimal" value="' + escapeHtml(state.txForm.amount) + '">' +
      '<div id="quickAddDynamic"></div>';
    modalShell(body);
    updateQuickAddDynamic();
    var descInput = document.getElementById('qaDescription');
    var amtInput = document.getElementById('qaAmount');
    descInput.addEventListener('input', function (e) { handleFieldChange('description', e.target.value); });
    amtInput.addEventListener('input', function (e) { handleFieldChange('amount', e.target.value); });
    descInput.focus();
  }

  function handleFieldChange(field, value) {
    if (field === 'description') {
      state.txForm.description = value;
      if (!state.presetCategoryActive) {
        var lower = value.toLowerCase();
        var isIncome = INCOME_KEYWORDS.some(function (k) { return lower.indexOf(k) !== -1; });
        state.txForm.type = isIncome ? 'income' : 'expense';
        if (!isIncome) {
          for (var cat in EXPENSE_KEYWORDS) {
            if (EXPENSE_KEYWORDS[cat].some(function (k) { return lower.indexOf(k) !== -1; })) { state.txForm.category = cat; break; }
          }
        }
      }
    } else if (field === 'amount') {
      var extracted = extractAmount(value);
      state.txForm.amount = extracted.amount != null ? String(extracted.amount) : value;
    }
    updateQuickAddDynamic();
  }

  function handleQuickTextChange(value) {
    state.quickText = value;
    var parsed = parseQuickAdd(value);
    var descEl = document.getElementById('qaDescription');
    var amtEl = document.getElementById('qaAmount');
    if (parsed.amount != null && amtEl) amtEl.value = String(parsed.amount);
    if (descEl) descEl.value = parsed.description;
    state.txForm.amount = parsed.amount != null ? String(parsed.amount) : '';
    state.txForm.description = parsed.description;
    if (!state.presetCategoryActive) { state.txForm.type = parsed.type; state.txForm.category = parsed.category; }
    updateQuickAddDynamic();
  }

  function updateQuickAddDynamic() {
    var el = document.getElementById('quickAddDynamic');
    if (!el) return;
    var catList = state.txForm.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    var hasAmount = !!state.txForm.amount;
    var html = '';
    if (state.listening) html += '<p class="qa-listen">Escuchando…</p>';
    html += '<div class="qa-cats">' +
      '<span class="qa-cat-add">' + ICONS.plus + '</span>' +
      catList.map(function (c) {
        return '<button type="button" class="qa-cat-chip ' + (state.txForm.category === c.name ? 'sel' : '') + '" data-action="set-form-category" data-category="' + escapeHtml(c.name) + '">' + c.emoji + ' ' + escapeHtml(c.name) + '</button>';
      }).join('') + '</div>';
    html += '<div class="qa-bottom-row">' +
      '<button class="qa-tag-btn" aria-label="Etiqueta">#</button>' +
      '<button class="' + (state.listening ? 'qa-mic-btn listening' : 'qa-mic-btn') + '" data-action="toggle-listen" aria-label="Dictar">' + ICONS.mic + '</button>' +
      '<button class="qa-save ' + (hasAmount && state.txForm.category ? 'ready' : '') + '" data-action="save-quick" ' + (hasAmount && state.txForm.category ? '' : 'disabled') + '>' + ICONS.check + ' Guardar</button>' +
      '</div>';
    el.innerHTML = html;
  }

  function exportCSV() {
    if (!state.transactions.length) { showToast('No hay movimientos para exportar'); return; }
    var rows = [['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Monto']];
    state.transactions.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); }).forEach(function (t) {
      rows.push([t.date || '', t.type === 'income' ? 'Ingreso' : 'Gasto', t.category || '', t.description || '', t.amount]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      }).join(',');
    }).join('\r\n');
    try {
      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'movimientos-' + todayISO() + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast('CSV descargado');
    } catch (e) {
      showToast('No se pudo exportar en este navegador');
    }
  }

  function saveQuickTransaction() {

    var tx = { id: 'tx_' + Date.now(), type: state.txForm.type, amount: amt, category: state.txForm.category, description: (state.txForm.description || '').trim(), date: state.txForm.date || todayISO() };
    state.transactions.unshift(tx);
    closeModal();
    showToast('¡Guardado!');
    saveState();
    render();
  }

    var el = e.target.closest('[data-action]');
    if (!el) { 
      if (state.showListMenu || state.showPeriodMenu) { state.showListMenu = false; state.showPeriodMenu = false; render(); }
      return;
    }
    var action = el.dataset.action, id = el.dataset.id;
    switch (action) {
      case 'toggle-list-menu': state.showListMenu = !state.showListMenu; state.showPeriodMenu = false; render(); break;
      case 'toggle-period-menu': state.showPeriodMenu = !state.showPeriodMenu; state.showListMenu = false; render(); break;
      case 'close-menus-goto': state.activeView = el.dataset.goto; state.showListMenu = false; render(); break;
      case 'set-period':
        state.periodType = el.dataset.period; state.showPeriodMenu = false;
        if (state.periodType === 'month' && !state.selectedMonth) state.selectedMonth = monthKey(new Date());
        if (state.periodType === 'year') state.selectedYear = String(new Date().getFullYear());
        render();
        break;
      case 'select-month': state.selectedMonth = el.dataset.month; render(); break;
      case 'open-settings': openSettingsModal(); break;
      case 'open-quick-add': openQuickAdd(); break;
      case 'open-quick-add-voice': openMicEntry(); break;
      case 'voice-cancel': closeVoiceCapture(); break;
      case 'voice-stop': stopVoiceListening(); break;
      case 'voice-save': saveVoiceTransaction(); break;
      case 'remove-multi': removeMultiCandidate(parseInt(el.dataset.idx, 10)); break;
      case 'save-multi': saveAllVoiceTransactions(); break;
      case 'delete-tx': deleteTransaction(id); break;
      case 'delete-goal': deleteGoal(id); break;
      case 'open-contribute': openContributeModal(id); break;
      case 'open-add-goal': openAddGoalModal(); break;
      case 'toggle-search': state.searchOpen = !state.searchOpen; if (!state.searchOpen) state.searchText = ''; render(); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-listen': toggleListening(); break;
      case 'set-form-category': setFormCategory(el.dataset.category); break;
      case 'save-quick': saveQuickTransaction(); break;
      case 'export-csv': exportCSV(); break;
      default: break;
    }
  });

  document.body.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'txSearchInput') {
      state.searchText = e.target.value;
      var container = document.getElementById('txListContainer');
      var list = periodTransactions();
      if (state.searchText.trim()) {
        var q = state.searchText.trim().toLowerCase();
        list = list.filter(function (t) { return (t.description || '').toLowerCase().indexOf(q) !== -1 || (t.category || '').toLowerCase().indexOf(q) !== -1; });
      }
      list = list.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
      if (container) container.outerHTML = list.length ? ('<ul class="tx-list" id="txListContainer">' + list.map(txItemHtml).join('') + '</ul>') : '<div class="empty" id="txListContainer"><p class="big disp">Sin resultados</p><p class="sub">Prueba otra búsqueda</p></div>';
    }
  });

  /* ---------- speech ---------- */
  function setupSpeech() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    state.speechSupported = true;
    recognition = new SR();
    recognition.lang = 'es-CO';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = function (event) {
      var transcript = event.results[0][0].transcript;
      if (state.voicePhase === 'listening') {
        state.quickText = transcript;
        var multi = parseMultiple(transcript);
        if (multi.length > 1) {
          state.voiceMultiResults = multi;
          state.listening = false;
          state.voicePhase = 'multi-result';
          stopAudioReactiveOrb();
          renderVoiceOverlay();
        } else {
          var parsed = multi[0] || parseQuickAdd(transcript);
          state.txForm.amount = parsed.amount != null ? String(parsed.amount) : '';
          state.txForm.description = parsed.description;
          state.txForm.type = parsed.type;
          state.txForm.category = parsed.category;
          showVoiceResult();
        }
      } else {
        handleQuickTextChange(transcript);
      }
    };
    recognition.onend = function () {
      state.listening = false;
      if (state.voicePhase === 'listening') renderVoiceOverlay();
      else updateQuickAddDynamic();
    };
    recognition.onerror = function () {
      state.listening = false;
      if (state.voicePhase === 'listening') { closeVoiceCapture(); showToast('No se escuchó bien. Intenta de nuevo o escribe.'); }
      else { updateQuickAddDynamic(); showToast('No se escuchó bien. Intenta de nuevo o escribe.'); }
    };
  }

  var lastAutoSync = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (!firebaseUrl()) return;
    if (document.getElementById('modalRoot') || document.getElementById('voiceRoot')) return;
    var now = Date.now();
    if (now - lastAutoSync < 4000) return;
    lastAutoSync = now;
    loadFromFirebase().then(function (data) {
      if (data) { applyData(data); applyTheme(); render(); }
    });
  });

  function init() {
    loadState();
    applyTheme();
    setupSpeech();
    render();
    initialFirebaseSync();
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get('quick') === '1') openMicEntry();
    } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
