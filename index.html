  @media (prefers-reduced-motion: reduce) {

    return formatted + (symbol == null ? '' : symbol);

  function categoryInfo(name) {
    for (var i = 0; i < EXPENSE_CATEGORIES.length; i++) {
      if (EXPENSE_CATEGORIES[i].name === name) return EXPENSE_CATEGORIES[i];
    }
    return null;
  }
  function categoryEmoji(name, type) {
    var list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) return list[i].emoji;
    }
    return '✨';
  }

  function extractAmount(text) {
    var match = text.match(/\d[\d.,]*\d|\d/);
    if (!match) return { amount: null, rest: text.trim() };
    var raw = match[0];
    var idx = match.index;
    var rest = (text.slice(0, idx) + text.slice(idx + raw.length)).replace(/[$]/g, ' ').replace(/\s+/g, ' ').trim();
    var lastComma = raw.lastIndexOf(',');
    var lastDot = raw.lastIndexOf('.');
    var decimalSep = null;
    if (lastComma > -1 && lastDot > -1) {
      decimalSep = lastComma > lastDot ? ',' : '.';
    } else if (lastComma > -1) {
      decimalSep = (raw.length - lastComma - 1) === 2 ? ',' : null;
    } else if (lastDot > -1) {
      decimalSep = (raw.length - lastDot - 1) === 2 ? '.' : null;
    }
    var normalized;
    if (decimalSep) {
      var other = decimalSep === ',' ? '.' : ',';
      normalized = raw.split(other).join('').replace(decimalSep, '.');
    } else {
      normalized = raw.replace(/[.,]/g, '');
    }
    var amount = parseFloat(normalized);
    return { amount: isNaN(amount) ? null : amount, rest: rest };
  }

  function parseQuickAdd(text) {
    var lower = text.toLowerCase();
    var extracted = extractAmount(text);
    var isIncome = INCOME_KEYWORDS.some(function (k) { return lower.indexOf(k) !== -1; });
    var type = isIncome ? 'income' : 'expense';
    var category = 'Otros';
    if (isIncome) {
      if (lower.indexOf('sueldo') !== -1 || lower.indexOf('salario') !== -1 || lower.indexOf('nomina') !== -1 || lower.indexOf('nómina') !== -1) category = 'Salario';
      else if (lower.indexOf('freelance') !== -1) category = 'Freelance';
      else if (lower.indexOf('invers') !== -1) category = 'Inversiones';
      else if (lower.indexOf('regalo') !== -1) category = 'Regalo';
    } else {
      outer:
      for (var cat in EXPENSE_KEYWORDS) {
        var kws = EXPENSE_KEYWORDS[cat];
        for (var i = 0; i < kws.length; i++) {
          if (lower.indexOf(kws[i]) !== -1) { category = cat; break outer; }
        }
      }
    }
    var description = extracted.rest || category;
    return { amount: extracted.amount, type: type, category: category, description: description };
  }

  /* ---------- storage: localStorage cache + optional Firebase sync ---------- */
  function firebaseUrl() {
    var url = localStorage.getItem('firebase-db-url');
    return url ? url.replace(/\/$/, '') : null;
  }

  function applyData(data) {
    state.transactions = Array.isArray(data.transactions) ? data.transactions : [];
    state.goals = Array.isArray(data.goals) ? data.goals : [];
    state.settings = Object.assign({ currencySymbol: '$', title: 'Nuestras Finanzas', viewMode: 'simple', darkMode: false }, data.settings || {});
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) applyData(JSON.parse(raw));
    } catch (e) { /* no local cache yet */ }
    state.loading = false;
  }

  function loadFromFirebase() {
    var url = firebaseUrl();
    if (!url) return Promise.resolve(undefined);
    return fetch(url + '/finance-data.json')
      .then(function (res) { if (!res.ok) throw new Error('bad response'); return res.json(); })
      .catch(function () { return undefined; });
  }

  function saveToFirebase(payload) {
    var url = firebaseUrl();
    if (!url) return Promise.resolve(true);
    return fetch(url + '/finance-data.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (res) { return res.ok; }).catch(function () { return false; });
  }

  function saveToFirebaseWithRetry(payload, attempt) {
    attempt = attempt || 0;
    return saveToFirebase(payload).then(function (ok) {
      if (ok || attempt >= 2) return ok;
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(saveToFirebaseWithRetry(payload, attempt + 1)); }, 500 * (attempt + 1));
      });
    });
  }

  function saveState() {
    state.saving = true;
    renderTopIcons();
    var payload = { transactions: state.transactions, goals: state.goals, settings: state.settings };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) { /* ignore */ }
    if (firebaseUrl()) {
      saveToFirebaseWithRetry(payload).then(function (ok) {
        state.saving = false;
        renderTopIcons();
        if (!ok) showToast('No se sincronizó con Firebase. Se guardó en este teléfono.');
      });
    } else {
      state.saving = false;
      renderTopIcons();
    }
  }

  function initialFirebaseSync() {
    if (!firebaseUrl()) return;
    loadFromFirebase().then(function (data) {
      if (data) {
        applyData(data);
        document.body.classList.toggle('dark', !!state.settings.darkMode);
        render();
      }
    });
  }

  function showToast(msg) {
    var existing = document.getElementById('toastEl');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      var e = document.getElementById('toastEl');
      if (e) e.remove();
    }, 2400);
  }

  /* ---------- derived data ---------- */
  function computeTotals() {
    var income = 0, expense = 0;
    state.transactions.forEach(function (t) {
      if (t.type === 'income') income += t.amount; else expense += t.amount;
    });
    return { income: income, expense: expense, balance: income - expense };
  }

  function computeCategoryBreakdown() {
    var map = {};
    state.transactions.filter(function (t) { return t.type === 'expense'; }).forEach(function (t) {
      map[t.category] = (map[t.category] || 0) + t.amount;
    });
    return Object.keys(map).map(function (name) { return { name: name, value: map[name] }; }).sort(function (a, b) { return b.value - a.value; });
  }

  function computeMonthlyTrend() {
    var map = {};
    state.transactions.forEach(function (t) {
      var month = (t.date || '').slice(0, 7);
      if (!month) return;
      if (!map[month]) map[month] = { month: month, Ingresos: 0, Gastos: 0 };
      if (t.type === 'income') map[month].Ingresos += t.amount; else map[month].Gastos += t.amount;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a.month.localeCompare(b.month); }).slice(-6);
  }

  function computeSparkPath() {
    var sorted = state.transactions.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
    var running = 0;
    var points = sorted.map(function (t) {
      running += t.type === 'income' ? t.amount : -t.amount;
      return running;
    });
    if (points.length < 2) return '';
    var min = Math.min.apply(null, points.concat([0]));
    var max = Math.max.apply(null, points.concat([0]));
    var range = max - min || 1;
    var w = 200, h = 30;
    return points.map(function (v, i) {
      var x = (i / (points.length - 1)) * w;
      var y = h - ((v - min) / range) * h;
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }

  function filteredSortedTransactions() {
    var list = state.transactions.slice();
    if (state.txFilter !== 'all') list = list.filter(function (t) { return t.type === state.txFilter; });
    if (state.searchText.trim()) {
      var q = state.searchText.trim().toLowerCase();
      list = list.filter(function (t) {
        return (t.description || '').toLowerCase().indexOf(q) !== -1 || (t.category || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    return list.sort(function (a, b) {
      var d = (b.date || '').localeCompare(a.date || '');
      if (d !== 0) return d;
      return (b.id || '').localeCompare(a.id || '');
    });
  }

  function recentTransactions() {
    return state.transactions.slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || (b.id || '').localeCompare(a.id || '');
    }).slice(0, 5);
  }

  /* ---------- charts (SVG) ---------- */
  function renderDonut(breakdown) {
    var total = breakdown.reduce(function (s, c) { return s + c.value; }, 0);
    if (!total) return '<p style="text-align:center;color:var(--muted);font-size:0.9rem;padding:32px 0;">Aún no hay gastos registrados</p>';
    var size = 180, radius = 62, stroke = 26, circ = 2 * Math.PI * radius, offset = 0;
    var arcs = breakdown.map(function (item) {
      var frac = item.value / total;
      var dash = frac * circ;
      var info = categoryInfo(item.name);
      var colorVar = info ? info.pieVar : '--faint';
      var svg = '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + radius + '" fill="none" style="stroke:var(' + colorVar + ')" stroke-width="' + stroke + '" stroke-dasharray="' + dash.toFixed(1) + ' ' + (circ - dash).toFixed(1) + '" stroke-dashoffset="' + (-offset).toFixed(1) + '" transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')" />';
      offset += dash;
      return svg;
    }).join('');
    var chart = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" height="200" style="display:block;margin:0 auto;max-width:200px;">' + arcs + '</svg>';
    var legend = '<div class="legend">' + breakdown.map(function (c) {
      var info = categoryInfo(c.name);
      var colorVar = info ? info.pieVar : '--faint';
      return '<div class="legend-item"><span class="dot" style="background:var(' + colorVar + ')"></span>' + escapeHtml(c.name) + '</div>';
    }).join('') + '</div>';
    return chart + legend;
  }

  function renderBarChart(monthly) {
    if (!monthly.length) return '<p style="text-align:center;color:var(--muted);font-size:0.9rem;padding:32px 0;">Sin datos todavía</p>';
    var w = 280, h = 170, padding = 26;
    var maxVal = 1;
    monthly.forEach(function (m) { maxVal = Math.max(maxVal, m.Ingresos, m.Gastos); });
    var groupW = (w - padding * 2) / monthly.length;
    var barW = Math.min(16, groupW * 0.3);
    var bars = '';
    monthly.forEach(function (m, i) {
      var gx = padding + i * groupW + groupW / 2 - barW - 2;
      var incH = (m.Ingresos / maxVal) * (h - padding * 2);
      var expH = (m.Gastos / maxVal) * (h - padding * 2);
      bars += '<rect x="' + gx.toFixed(1) + '" y="' + (h - padding - incH).toFixed(1) + '" width="' + barW + '" height="' + incH.toFixed(1) + '" rx="4" style="fill:var(--green)" />';
      bars += '<rect x="' + (gx + barW + 4).toFixed(1) + '" y="' + (h - padding - expH).toFixed(1) + '" width="' + barW + '" height="' + expH.toFixed(1) + '" rx="4" style="fill:var(--red)" />';
      bars += '<text x="' + (gx + barW + 2).toFixed(1) + '" y="' + (h - padding + 14) + '" font-size="9" style="fill:var(--muted)" text-anchor="middle">' + escapeHtml(m.month.slice(5)) + '</text>';
    });
    var chart = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="170">' + bars + '</svg>';
    var legend = '<div class="legend"><div class="legend-item"><span class="dot" style="background:var(--green)"></span>Ingresos</div><div class="legend-item"><span class="dot" style="background:var(--red)"></span>Gastos</div></div>';
    return chart + legend;
  }

  /* ---------- render: shell ---------- */
  function render() {
    var app = document.getElementById('app');
    if (state.loading) {
      app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;"><span style="color:var(--red)" class="spin">' + iconSvg('refresh', 28) + '</span></div>';
      return;
    }
    app.innerHTML = '<div class="wrap fade-in">' + renderHeader() + renderTabContent() + '</div>' +
      '<button class="fab" data-action="open-quick-add">' + ICONS.micBig + '</button>' +
      renderTabBar();
    attachDynamicListeners();
  }

  function iconSvg(name, size) {
    return ICONS[name] || '';
  }

  function renderTopIcons() {
    var el = document.getElementById('savingIndicator');
    if (el) el.style.display = state.saving ? 'inline-flex' : 'none';
  }

  function renderHeader() {
    var s = state.settings;
    var html = '<header class="hero">';
    html += '<div class="title-row"><p class="title disp">' + escapeHtml(s.title || 'Nuestras Finanzas') + '</p>' +
      '<div class="icon-row">' +
      '<span id="savingIndicator" style="display:' + (state.saving ? 'inline-flex' : 'none') + ';color:var(--red);align-items:center;" class="spin">' + ICONS.refresh + '</span>' +
      '<button class="icon-btn" data-action="toggle-dark" aria-label="Cambiar tema">' + (s.darkMode ? ICONS.sun : ICONS.moon) + '</button>' +
      '<button class="icon-btn" data-action="refresh" aria-label="Actualizar">' + ICONS.refresh + '</button>' +
      '<button class="icon-btn" data-action="open-settings" aria-label="Ajustes">' + ICONS.settings + '</button>' +
      '</div></div>';

    if (state.activeTab === 'resumen') {
      var totals = computeTotals();
      var spark = computeSparkPath();
      html += '<div class="mode-toggle">' +
        '<button class="' + (s.viewMode !== 'avanzada' ? 'active' : '') + '" data-action="set-view-mode" data-mode="simple">Simple</button>' +
        '<button class="' + (s.viewMode === 'avanzada' ? 'active' : '') + '" data-action="set-view-mode" data-mode="avanzada">Avanzada</button>' +
        '</div>';
      html += '<div class="balance-row"><span class="balance-num disp" style="color:' + (totals.balance >= 0 ? 'var(--ink)' : 'var(--red)') + '">' + (totals.balance < 0 ? '\u2212' : '') + formatMoney(totals.balance, '') + '</span>' +
        '<span class="balance-sym disp">' + escapeHtml(s.currencySymbol) + '</span></div>';
      html += '<p class="balance-label">Balance conjunto</p>';
      if (spark) {
        html += '<svg viewBox="0 0 200 30" width="100%" height="24" preserveAspectRatio="none" style="display:block;margin-bottom:14px;"><path d="' + spark + '" fill="none" style="stroke:var(' + (totals.balance >= 0 ? '--green' : '--red') + ')" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
      html += '<div class="stats-row">' +
        '<div class="stat-pill"><span class="stat-dot" style="background:var(--green-tint);color:var(--green)">' + ICONS.plus + '</span><span class="stat-num disp">' + formatMoney(totals.income, s.currencySymbol) + '</span></div>' +
        '<div class="stat-pill"><span class="stat-dot" style="background:var(--red-tint-soft);color:var(--red)">' + ICONS.minus + '</span><span class="stat-num disp">' + formatMoney(totals.expense, s.currencySymbol) + '</span></div>' +
        '</div>';
      html += '<p class="cat-label disp">Categorías</p><div class="cat-grid">' + EXPENSE_CATEGORIES.map(function (c) {
        return '<button class="cat-item" data-action="open-quick-add" data-category="' + escapeHtml(c.name) + '">' +
          '<span class="cat-circle" style="background:var(' + c.bgVar + ')">' + c.emoji + '</span>' +
          '<span class="cat-name">' + escapeHtml(c.name) + '</span></button>';
      }).join('') + '</div>';
    } else {
      html += '<p class="tab-title disp">' + (state.activeTab === 'movimientos' ? 'Movimientos' : 'Metas') + '</p>';
    }
    html += '</header>';
    return html;
  }

  function renderTabContent() {
    if (state.activeTab === 'resumen') return renderResumen();
    if (state.activeTab === 'movimientos') return renderMovimientos();
    return renderMetas();
  }

  function renderResumen() {
    if (!state.transactions.length) {
      return '<div class="section"><div class="empty"><p class="big disp">Sin movimientos todavía</p><p class="sub">Toca el micrófono o una categoría para registrar el primero.</p></div></div>';
    }
    if (state.settings.viewMode !== 'avanzada') {
      var recent = recentTransactions();
      return '<div class="section"><h2 class="section-title disp">Recientes</h2><ul class="tx-list">' +
        recent.map(function (t) { return txItemHtml(t, false); }).join('') + '</ul></div>';
    }
    var breakdown = computeCategoryBreakdown();
    var monthly = computeMonthlyTrend();
    var goalsHtml = '';
    if (state.goals.length) {
      goalsHtml = '<section style="margin-top:24px;"><h2 class="section-title disp">Metas en progreso</h2><div style="display:flex;flex-direction:column;gap:12px;">' +
        state.goals.slice(0, 3).map(function (g) { return goalCardHtml(g, true); }).join('') + '</div></section>';
    }
    return '<div class="section">' +
      '<section><h2 class="section-title disp">Gastos por categoría</h2><div class="card">' + renderDonut(breakdown) + '</div></section>' +
      '<section style="margin-top:24px;"><h2 class="section-title disp">Tendencia mensual</h2><div class="card">' + renderBarChart(monthly) + '</div></section>' +
      goalsHtml + '</div>';
  }

  function txItemHtml(t) {
    var info = categoryInfo(t.category);
    var bg = info ? 'var(' + info.bgVar + ')' : 'var(--surface)';
    var color = t.type === 'income' ? 'var(--green)' : 'var(--red)';
    return '<li class="tx-item">' +
      '<div class="tx-left"><span class="tx-icon" style="background:' + bg + '">' + categoryEmoji(t.category, t.type) + '</span>' +
      '<div style="min-width:0"><p class="tx-desc">' + escapeHtml(t.description || t.category) + '</p>' +
      '<p class="tx-meta">' + escapeHtml(t.category) + ' · ' + escapeHtml(t.date) + '</p></div></div>' +
      '<div class="tx-right"><span class="tx-amount disp" style="color:' + color + '">' + (t.type === 'income' ? '+' : '\u2212') + formatMoney(t.amount, state.settings.currencySymbol) + '</span>' +
      '<button data-action="delete-tx" data-id="' + t.id + '" aria-label="Eliminar" style="color:var(--faint)">' + ICONS.trash + '</button></div></li>';
  }

  function renderMovimientos() {
    var list = filteredSortedTransactions();
    var html = '<div class="section">' +
      '<div class="search-row">' + ICONS.search + '<input id="txSearchInput" placeholder="Buscar movimientos" value="' + escapeHtml(state.searchText) + '"></div>' +
      '<div class="chips">' +
      ['all', 'income', 'expense'].map(function (f) {
        var label = f === 'all' ? 'Todos' : f === 'income' ? 'Ingresos' : 'Gastos';
        return '<button class="chip ' + (state.txFilter === f ? 'active' : '') + '" data-action="set-tx-filter" data-filter="' + f + '">' + label + '</button>';
      }).join('') + '</div>' +
      '<div id="txListContainer">' + renderTxListInner(list) + '</div>' +
      '</div>';
    return html;
  }

  function renderTxListInner(list) {
    if (!list.length) {
      return '<div class="empty"><p class="big disp">Sin resultados</p><p class="sub">Prueba otra búsqueda o registra un movimiento nuevo</p></div>';
    }
    return '<ul class="tx-list">' + list.map(function (t) { return txItemHtml(t); }).join('') + '</ul>';
  }

  function goalCardHtml(g, compact) {
    var pct = g.targetAmount > 0 ? Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100)) : 0;
    var html = '<div class="goal-card"><div class="goal-top"><h3 class="goal-name disp">' + escapeHtml(g.name) + '</h3>';
    if (!compact) html += '<button data-action="delete-goal" data-id="' + g.id + '" aria-label="Eliminar meta" style="color:var(--faint)">' + ICONS.trash + '</button>';
    html += '</div><div class="goal-bar-track"><div class="goal-bar-fill" style="width:' + pct + '%;background:var(' + (pct >= 100 ? '--green' : '--red') + ')"></div></div>' +
      '<div class="goal-stats"><span>' + formatMoney(g.currentAmount, state.settings.currencySymbol) + ' de ' + formatMoney(g.targetAmount, state.settings.currencySymbol) + '</span><span style="color:' + (pct >= 100 ? 'var(--green)' : 'var(--muted)') + '">' + pct + '%</span></div>';
    if (g.deadline) html += '<p class="goal-deadline">Meta: ' + escapeHtml(g.deadline) + '</p>';
    if (!compact) html += '<button class="goal-add-btn" data-action="open-contribute" data-id="' + g.id + '">Agregar aporte</button>';
    html += '</div>';
    return html;
  }

  function renderMetas() {
    var html = '<div class="section">';
    if (!state.goals.length) {
      html += '<div class="empty"><p class="big disp">Sin metas todavía</p><p class="sub">Creen su primera meta de ahorro juntos</p></div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:12px;">' + state.goals.map(function (g) { return goalCardHtml(g, false); }).join('') + '</div>';
    }
    html += '<button class="new-goal-btn" data-action="open-add-goal">+ Nueva meta</button></div>';
    return html;
  }

  function renderTabBar() {
    var tabs = [
      { id: 'resumen', label: 'Resumen', icon: 'home' },
      { id: 'movimientos', label: 'Movimientos', icon: 'receipt' },
      { id: 'metas', label: 'Metas', icon: 'piggy' },
    ];
    return '<nav class="tabbar"><div class="tabbar-inner">' + tabs.map(function (t) {
      return '<button class="tab-btn ' + (state.activeTab === t.id ? 'active' : '') + '" data-action="set-tab" data-tab="' + t.id + '">' + ICONS[t.icon] + '<span>' + t.label + '</span></button>';
    }).join('') + '</div></nav>';
  }

  /* ---------- modals ---------- */
  function closeModal() {
    var root = document.getElementById('modalRoot');
    if (root) root.remove();
    state.modal = null;
    if (recognition && state.listening) {
      try { recognition.stop(); } catch (e) {}
    }
    state.listening = false;
  }

  function modalShell(title, bodyHtml) {
    var el = document.createElement('div');
    el.id = 'modalRoot';
    el.className = 'modal-overlay';
    el.innerHTML = '<div class="modal-sheet" onclick="event.stopPropagation()">' +
      '<div class="modal-handle"></div>' +
      '<div class="modal-top"><h3 class="modal-title disp">' + escapeHtml(title) + '</h3>' +
      '<button class="modal-close" data-action="close-modal" aria-label="Cerrar">' + ICONS.x + '</button></div>' +
      bodyHtml + '</div>';
    el.addEventListener('click', closeModal);
    document.body.appendChild(el);
    return el;
  }

  function openQuickAdd(presetCategory) {
    state.quickText = '';
    state.showManualEdit = false;
    state.presetCategoryActive = !!presetCategory;
    state.txForm = { type: 'expense', amount: '', category: presetCategory || '', description: '', date: todayISO() };
    renderQuickAddModal();
    if (recognition && !presetCategory) {
      setTimeout(function () {
        try { recognition.start(); state.listening = true; updateQuickAddDynamic(); } catch (e) { state.listening = false; }
      }, 250);
    }
  }

  function renderQuickAddModal() {
    var body = '<div class="quick-row"><input id="quickTextInput" placeholder="Ej: Uber 25000" autofocus value="' + escapeHtml(state.quickText) + '">' +
      '<button class="mic-btn" id="micToggleBtn" data-action="toggle-listen" aria-label="Dictar por voz">' + ICONS.mic + '</button></div>' +
      '<div id="quickAddDynamic"></div>';
    modalShell('Nuevo movimiento', body);
    var input = document.getElementById('quickTextInput');
    input.addEventListener('input', function (e) {
      handleQuickTextChange(e.target.value);
    });
    input.focus();
    updateQuickAddDynamic();
  }

  function handleQuickTextChange(value) {
    state.quickText = value;
    var parsed = parseQuickAdd(value);
    state.txForm.amount = parsed.amount ? String(parsed.amount) : '';
    if (!state.presetCategoryActive) {
      state.txForm.type = parsed.type;
      state.txForm.category = parsed.category;
    }
    state.txForm.description = parsed.description;
    updateQuickAddDynamic();
  }

  function updateQuickAddDynamic() {
    var el = document.getElementById('quickAddDynamic');
    if (!el) return;
    var micBtn = document.getElementById('micToggleBtn');
    if (micBtn) micBtn.className = 'mic-btn' + (state.listening ? ' listening' : '');
    var hasParsed = !!state.txForm.amount && !!state.txForm.category;
    var html = '';
    if (state.listening) html += '<p class="listening-label">Escuchando…</p>';
    if (!state.showManualEdit && hasParsed) {
      var info = categoryInfo(state.txForm.category);
      var bg = info ? 'var(' + info.bgVar + ')' : 'var(--surface)';
      html += '<div class="preview-card" style="background:' + bg + '">' +
        '<div class="preview-top"><span class="preview-icon">' + categoryEmoji(state.txForm.category, state.txForm.type) + '</span>' +
        '<div><p class="preview-desc disp">' + escapeHtml(state.txForm.description || state.txForm.category) + '</p>' +
        '<span class="preview-tag">' + escapeHtml(state.txForm.category) + '</span></div></div>' +
        '<p class="preview-amount disp" style="color:' + (state.txForm.type === 'income' ? 'var(--green)' : 'var(--red)') + '">' +
        (state.txForm.type === 'income' ? '+' : '\u2212') + formatMoney(state.txForm.amount, state.settings.currencySymbol) + '</p></div>' +
        '<div class="confirm-row"><button class="btn-primary" data-action="save-quick">Guardar</button>' +
        '<button class="btn-edit" data-action="show-manual-edit">' + ICONS.pencil + ' Editar</button></div>';
    } else if (!state.showManualEdit && !hasParsed && !state.listening) {
      html += '<p class="hint-text">Di o escribe algo como "Tacos 23.50" — completamos el resto.</p>';
    }
    if (state.showManualEdit) {
      html += renderManualEditForm();
    }
    el.innerHTML = html;
  }

  function renderManualEditForm() {
    var f = state.txForm;
    var catList = f.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    var html = '<div class="type-toggle">' +
      '<button class="expense ' + (f.type === 'expense' ? 'active' : '') + '" data-action="set-form-type" data-type="expense">Gasto</button>' +
      '<button class="income ' + (f.type === 'income' ? 'active' : '') + '" data-action="set-form-type" data-type="income">Ingreso</button>' +
      '</div>';
    html += '<div class="field"><label>Monto</label><input class="money" type="number" step="0.01" min="0" id="manualAmount" value="' + escapeHtml(f.amount) + '" placeholder="0"></div>';
    html += '<div class="field"><label>Categoría</label><div class="cat-chips">' + catList.map(function (c) {
      return '<button class="cat-chip ' + (f.category === c.name ? 'active' : '') + '" data-action="set-form-category" data-category="' + escapeHtml(c.name) + '">' + c.emoji + ' ' + escapeHtml(c.name) + '</button>';
    }).join('') + '</div></div>';
    html += '<div class="field"><label>Descripción</label><input class="small" id="manualDescription" value="' + escapeHtml(f.description) + '" placeholder="Opcional"></div>';
    html += '<div class="field"><label>Fecha</label><input class="small" type="date" id="manualDate" value="' + escapeHtml(f.date) + '"></div>';
    html += '<button class="btn-primary" style="width:100%" data-action="save-quick" id="manualSaveBtn"' + (!f.amount || !f.category ? ' disabled' : '') + '>Guardar</button>';
    return html;
  }

  function bindManualEditInputs() {
    var amt = document.getElementById('manualAmount');
    if (amt) amt.addEventListener('input', function (e) { state.txForm.amount = e.target.value; refreshManualSaveBtn(); });
    var desc = document.getElementById('manualDescription');
    if (desc) desc.addEventListener('input', function (e) { state.txForm.description = e.target.value; });
    var date = document.getElementById('manualDate');
    if (date) date.addEventListener('input', function (e) { state.txForm.date = e.target.value; });
  }
  function refreshManualSaveBtn() {
    var btn = document.getElementById('manualSaveBtn');
    if (btn) btn.disabled = !state.txForm.amount || !state.txForm.category;
  }

  function saveQuickTransaction() {
    var amt = parseFloat(state.txForm.amount);
    if (!amt || amt <= 0 || !state.txForm.category) return;
    var tx = {
      id: 'tx_' + Date.now(),
      type: state.txForm.type,
      amount: amt,
      category: state.txForm.category,
      description: (state.txForm.description || '').trim(),
      date: state.txForm.date || todayISO(),
    };
    state.transactions.unshift(tx);
    closeModal();
    showToast('¡Guardado!');
    saveState();
    render();
  }

  function deleteTransaction(id) {
    state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
    saveState();
    render();
  }

  function openAddGoalModal() {
    var body = '<form id="goalForm">' +
      '<div class="field"><label>Nombre de la meta</label><input id="goalName" placeholder="Ej. Fondo de emergencia" required></div>' +
      '<div class="field"><label>Monto objetivo</label><input class="money" type="number" step="0.01" min="0" id="goalTarget" placeholder="0" required></div>' +
      '<div class="field"><label>Fecha límite (opcional)</label><input class="small" type="date" id="goalDeadline"></div>' +
      '<button class="btn-primary" style="width:100%" type="submit">Crear meta</button></form>';
    modalShell('Nueva meta de ahorro', body);
    document.getElementById('goalForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('goalName').value.trim();
      var target = parseFloat(document.getElementById('goalTarget').value);
      if (!name || !target || target <= 0) return;
      state.goals.push({ id: 'goal_' + Date.now(), name: name, targetAmount: target, currentAmount: 0, deadline: document.getElementById('goalDeadline').value || null });
      closeModal();
      showToast('Meta creada');
      saveState();
      render();
    });
  }

  function deleteGoal(id) {
    state.goals = state.goals.filter(function (g) { return g.id !== id; });
    saveState();
    render();
  }

  function openContributeModal(goalId) {
    var goal = state.goals.find(function (g) { return g.id === goalId; });
    if (!goal) return;
    state.contributingGoalId = goalId;
    var body = '<form id="contribForm">' +
      '<div class="field"><label>Monto a aportar</label><input class="money" type="number" step="0.01" min="0" id="contribAmount" placeholder="0" autofocus required></div>' +
      '<button class="btn-primary" style="width:100%;background:var(--green)" type="submit">Confirmar aporte</button></form>';
    modalShell('Aportar a "' + goal.name + '"', body);
    document.getElementById('contribForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var amt = parseFloat(document.getElementById('contribAmount').value);
      if (!amt || amt <= 0) return;
      state.goals = state.goals.map(function (g) { return g.id === goalId ? Object.assign({}, g, { currentAmount: g.currentAmount + amt }) : g; });
      closeModal();
      showToast('Aporte registrado');
      saveState();
      render();
    });
  }

  function openSettingsModal() {
    var s = state.settings;
    var fbUrl = localStorage.getItem('firebase-db-url') || '';
    var body = '<form id="settingsForm">' +
      '<div class="field"><label>Nombre del espacio</label><input id="setTitle" value="' + escapeHtml(s.title) + '"></div>' +
      '<div class="field"><label>Símbolo de moneda</label><input id="setSymbol" maxlength="4" value="' + escapeHtml(s.currencySymbol) + '" placeholder="$, €, S/, Bs..."></div>' +
      '<div class="field"><label>URL de Firebase (opcional, para compartir)</label><input class="small" id="setFirebaseUrl" value="' + escapeHtml(fbUrl) + '" placeholder="https://tu-proyecto-default-rtdb.firebaseio.com"></div>' +
      '<p style="font-size:0.75rem;color:var(--faint);margin:0 0 16px;">' +
      (fbUrl ? 'Sincronizando con Firebase — pon la misma URL en el teléfono de tu pareja.' : 'Sin URL, los datos solo se guardan en este teléfono.') +
      '</p>' +
      '<button class="btn-primary" style="width:100%" type="submit">Guardar ajustes</button></form>';
    modalShell('Ajustes', body);
    document.getElementById('settingsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      state.settings.title = document.getElementById('setTitle').value || 'Nuestras Finanzas';
      state.settings.currencySymbol = document.getElementById('setSymbol').value || '$';
      var newUrl = document.getElementById('setFirebaseUrl').value.trim();
      if (newUrl) localStorage.setItem('firebase-db-url', newUrl.replace(/\/$/, ''));
      else localStorage.removeItem('firebase-db-url');
      closeModal();
      showToast('Ajustes guardados');
      saveState();
      if (newUrl) initialFirebaseSync();
      render();
    });
  }

  /* ---------- actions ---------- */
  function setActiveTab(tab) { state.activeTab = tab; render(); }
  function setViewMode(mode) { state.settings.viewMode = mode; saveState(); render(); }
  function toggleDarkMode() {
    state.settings.darkMode = !state.settings.darkMode;
    document.body.classList.toggle('dark', state.settings.darkMode);
    saveState();
    render();
  }
  function refreshFromStorage() {
    if (firebaseUrl()) {
      state.loading = true;
      render();
      loadFromFirebase().then(function (data) {
        state.loading = false;
        if (data) applyData(data);
        document.body.classList.toggle('dark', !!state.settings.darkMode);
        showToast(data ? 'Actualizado' : 'Sin conexión con Firebase; se ve la copia local');
        render();
      });
      return;
    }
    loadState();
    document.body.classList.toggle('dark', !!state.settings.darkMode);
    showToast('Actualizado');
    render();
  }
  function setTxFilter(filter) {
    state.txFilter = filter;
    var container = document.getElementById('txListContainer');
    if (container) container.innerHTML = renderTxListInner(filteredSortedTransactions());
    var chipsParent = document.querySelector('.chips');
    if (chipsParent) {
      Array.prototype.forEach.call(chipsParent.children, function (chip) {
        chip.classList.toggle('active', chip.dataset.filter === filter);
      });
    }
  }
  function toggleListening() {
    if (!recognition) { showToast('Dictado no disponible: escribe el gasto arriba.'); return; }
    if (state.listening) {
      recognition.stop();
      state.listening = false;
    } else {
      try { recognition.start(); state.listening = true; } catch (e) { state.listening = false; }
    }
    updateQuickAddDynamic();
  }
  function setFormType(type) {
    state.presetCategoryActive = true;
    state.txForm.type = type;
    state.txForm.category = '';
    updateQuickAddDynamic();
  }
  function setFormCategory(cat) {
    state.presetCategoryActive = true;
    state.txForm.category = cat;
    updateQuickAddDynamic();
  }

  /* ---------- event delegation ---------- */
  function attachDynamicListeners() {
    var searchInput = document.getElementById('txSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function (e) {
        state.searchText = e.target.value;
        var container = document.getElementById('txListContainer');
        if (container) container.innerHTML = renderTxListInner(filteredSortedTransactions());
      });
    }
  }

  document.body.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;
    switch (action) {
      case 'set-tab': setActiveTab(el.dataset.tab); break;
      case 'toggle-dark': toggleDarkMode(); break;
      case 'refresh': refreshFromStorage(); break;
      case 'open-settings': openSettingsModal(); break;
      case 'open-quick-add': openQuickAdd(el.dataset.category || null); break;
      case 'set-view-mode': setViewMode(el.dataset.mode); break;
      case 'delete-tx': deleteTransaction(id); break;
      case 'delete-goal': deleteGoal(id); break;
      case 'open-contribute': openContributeModal(id); break;
      case 'open-add-goal': openAddGoalModal(); break;
      case 'set-tx-filter': setTxFilter(el.dataset.filter); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-listen': toggleListening(); break;
      case 'show-manual-edit':
        state.showManualEdit = true;
        updateQuickAddDynamic();
        bindManualEditInputs();
        break;
      case 'set-form-type':
        setFormType(el.dataset.type);
        bindManualEditInputs();
        break;
      case 'set-form-category':
        setFormCategory(el.dataset.category);
        bindManualEditInputs();
        break;
      case 'save-quick': saveQuickTransaction(); break;
      default: break;
    }
  });

  /* ---------- speech recognition ---------- */
  function setupSpeech() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    state.speechSupported = true;
    recognition = new SR();
    recognition.lang = 'es-CO';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = function (event) {
      var transcript = event.results[0][0].transcript;
      var input = document.getElementById('quickTextInput');
      if (input) input.value = transcript;
      handleQuickTextChange(transcript);
    };
    recognition.onend = function () { state.listening = false; updateQuickAddDynamic(); };
    recognition.onerror = function () {
      state.listening = false;
      updateQuickAddDynamic();
      showToast('No se escuchó bien. Intenta de nuevo o escribe.');
    };
  }

  /* ---------- init ---------- */
  function init() {
    loadState();
    document.body.classList.toggle('dark', !!state.settings.darkMode);
    setupSpeech();
    render();
    initialFirebaseSync();
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get('quick') === '1') openQuickAdd();
    } catch (e) { /* ignore */ }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
